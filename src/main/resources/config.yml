# InvSwitcher Config
# Worlds to operate. Nether and End worlds are automatically included.
worlds:
- acidisland_world
- oneblock_world
- boxed_world
- bskyblock_world
- skyblock-world
- caveblock-world
- poseidon_world
- stranger_world
options:
  # 
  # Per-world settings. Gamemode means Survivial, Creative, etc.
  inventory: true
  health: true
  food: true
  advancements: true
  gamemode: true
  experience: true
  ender-chest: true
  statistics: true
  # Switch inventories based on island. Only applies if players own more than one island.
  # Each sub-option controls whether that aspect is switched per-island.
  # The world-level option must also be true for the island option to have any effect.
  islands:
    active: true
    inventory: true
    health: false
    food: false
    advancements: false
    gamemode: false
    experience: false
    ender-chest: true
    statistics: false
