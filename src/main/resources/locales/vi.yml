        description: "đặt số dư của người chơi"
        parameters: "<player> <amount>"
        success: "&a Đã đặt số dư của [name] thành [number]"
      balance:
        description: "hiển thị số dư của người chơi"
        parameters: "<player>"
        balance: "&a Số dư của [name]: &e[number]"
