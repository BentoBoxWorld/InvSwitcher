        parameters: "<player> <amount>"
        success: "&a Đã đưa tiền cho [name]. Số dư mới: [number]"
      take:
        description: "lấy tiền từ người chơi"
        parameters: "<player> <amount>"
        success: "&a Đã lấy tiền từ [name]. Số dư mới: [number]"
